[project]
name = "aifp-aos"
version = "0.1.0"
description = "AiFinPay Autonomous OS"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.31",
    "alembic>=1.13.2",
    "pydantic-settings>=2.3.4",
    "litellm>=1.40.0",
    "google-adk>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "dramatiq[redis]>=1.17.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "pydantic>=2.8.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "sentence-transformers>=2.2.0",
    "pgvector>=0.2.0",
    "torch>=2.2.0",
    "periodiq>=0.14.0",
    "prometheus-client>=0.20.0",
    "numpy>=1.24.0",
    "google-auth>=2.23.0",
    "google-api-python-client>=2.100.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "respx>=0.23.1",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "locust>=2.46.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:.*Using .httpx. with .starlette.testclient. is deprecated.*",
    "ignore:.*BaseAgentConfig is deprecated.*:DeprecationWarning",
    "ignore:.*crypt.*:DeprecationWarning",
    "ignore::DeprecationWarning:passlib.*",
]
markers = [
    "integration: marks tests as integration tests requiring real credentials (deselect with '-m \"not integration\"')",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
