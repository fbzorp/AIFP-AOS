services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aifp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aifp_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aifp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aifp} -d ${POSTGRES_DB:-aifp_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - aifp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-api:latest
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aifp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aifp_prod}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      MOLTBOOK_BASE_URL: ${MOLTBOOK_BASE_URL}
      MOLTBOOK_API_KEY: ${MOLTBOOK_API_KEY}
      MOLTBOOK_AGENT_API_KEY: ${MOLTBOOK_AGENT_API_KEY}
      MOLTBOOK_APP_KEY: ${MOLTBOOK_APP_KEY}
      MOLTBOOK_AUTOPUBLISH: ${MOLTBOOK_AUTOPUBLISH:-false}
      X_API_KEY: ${X_API_KEY}
      X_API_SECRET: ${X_API_SECRET}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN}
      X_ACCESS_TOKEN_SECRET: ${X_ACCESS_TOKEN_SECRET}
      X_AUTOPUBLISH: ${X_AUTOPUBLISH:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_DEFAULT_CHANNEL: ${TELEGRAM_DEFAULT_CHANNEL}
      TELEGRAM_AUTOPUBLISH: ${TELEGRAM_AUTOPUBLISH:-false}
      NEWS_API_KEY: ${NEWS_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      FOUNDER_CONTENT_X_API_KEY: ${FOUNDER_CONTENT_X_API_KEY}
      FOUNDER_CONTENT_X_API_SECRET: ${FOUNDER_CONTENT_X_API_SECRET}
      FOUNDER_CONTENT_X_ACCESS_TOKEN: ${FOUNDER_CONTENT_X_ACCESS_TOKEN}
      FOUNDER_CONTENT_X_ACCESS_TOKEN_SECRET: ${FOUNDER_CONTENT_X_ACCESS_TOKEN_SECRET}
      FOUNDER_CONTENT_X_AUTOPUBLISH: ${FOUNDER_CONTENT_X_AUTOPUBLISH:-false}
      FOUNDER_CONTENT_TELEGRAM_BOT_TOKEN: ${FOUNDER_CONTENT_TELEGRAM_BOT_TOKEN}
      FOUNDER_CONTENT_TELEGRAM_CHAT_ID: ${FOUNDER_CONTENT_TELEGRAM_CHAT_ID}
      FOUNDER_CONTENT_TELEGRAM_AUTOPUBLISH: ${FOUNDER_CONTENT_TELEGRAM_AUTOPUBLISH:-false}
      FOUNDER_CONTENT_TELEGRAM_DEFAULT_CHANNEL: ${FOUNDER_CONTENT_TELEGRAM_DEFAULT_CHANNEL}
      FOUNDER_CONTENT_MOLTBOOK_AGENT_API_KEY: ${FOUNDER_CONTENT_MOLTBOOK_AGENT_API_KEY}
      FOUNDER_CONTENT_MOLTBOOK_APP_KEY: ${FOUNDER_CONTENT_MOLTBOOK_APP_KEY}
      FOUNDER_CONTENT_MOLTBOOK_AUTOPUBLISH: ${FOUNDER_CONTENT_MOLTBOOK_AUTOPUBLISH:-false}
      TECHNICAL_CONTENT_X_API_KEY: ${TECHNICAL_CONTENT_X_API_KEY}
      TECHNICAL_CONTENT_X_API_SECRET: ${TECHNICAL_CONTENT_X_API_SECRET}
      TECHNICAL_CONTENT_X_ACCESS_TOKEN: ${TECHNICAL_CONTENT_X_ACCESS_TOKEN}
      TECHNICAL_CONTENT_X_ACCESS_TOKEN_SECRET: ${TECHNICAL_CONTENT_X_ACCESS_TOKEN_SECRET}
      TECHNICAL_CONTENT_X_AUTOPUBLISH: ${TECHNICAL_CONTENT_X_AUTOPUBLISH:-false}
      TECHNICAL_CONTENT_TELEGRAM_BOT_TOKEN: ${TECHNICAL_CONTENT_TELEGRAM_BOT_TOKEN}
      TECHNICAL_CONTENT_TELEGRAM_CHAT_ID: ${TECHNICAL_CONTENT_TELEGRAM_CHAT_ID}
      TECHNICAL_CONTENT_TELEGRAM_AUTOPUBLISH: ${TECHNICAL_CONTENT_TELEGRAM_AUTOPUBLISH:-false}
      TECHNICAL_CONTENT_TELEGRAM_DEFAULT_CHANNEL: ${TECHNICAL_CONTENT_TELEGRAM_DEFAULT_CHANNEL}
      TECHNICAL_CONTENT_MOLTBOOK_AGENT_API_KEY: ${TECHNICAL_CONTENT_MOLTBOOK_AGENT_API_KEY}
      TECHNICAL_CONTENT_MOLTBOOK_APP_KEY: ${TECHNICAL_CONTENT_MOLTBOOK_APP_KEY}
      TECHNICAL_CONTENT_MOLTBOOK_AUTOPUBLISH: ${TECHNICAL_CONTENT_MOLTBOOK_AUTOPUBLISH:-false}
      SEO_CONTENT_X_API_KEY: ${SEO_CONTENT_X_API_KEY}
      SEO_CONTENT_X_API_SECRET: ${SEO_CONTENT_X_API_SECRET}
      SEO_CONTENT_X_ACCESS_TOKEN: ${SEO_CONTENT_X_ACCESS_TOKEN}
      SEO_CONTENT_X_ACCESS_TOKEN_SECRET: ${SEO_CONTENT_X_ACCESS_TOKEN_SECRET}
      SEO_CONTENT_X_AUTOPUBLISH: ${SEO_CONTENT_X_AUTOPUBLISH:-false}
      SEO_CONTENT_TELEGRAM_BOT_TOKEN: ${SEO_CONTENT_TELEGRAM_BOT_TOKEN}
      SEO_CONTENT_TELEGRAM_CHAT_ID: ${SEO_CONTENT_TELEGRAM_CHAT_ID}
      SEO_CONTENT_TELEGRAM_AUTOPUBLISH: ${SEO_CONTENT_TELEGRAM_AUTOPUBLISH:-false}
      SEO_CONTENT_TELEGRAM_DEFAULT_CHANNEL: ${SEO_CONTENT_TELEGRAM_DEFAULT_CHANNEL}
      SEO_CONTENT_MOLTBOOK_AGENT_API_KEY: ${SEO_CONTENT_MOLTBOOK_AGENT_API_KEY}
      SEO_CONTENT_MOLTBOOK_APP_KEY: ${SEO_CONTENT_MOLTBOOK_APP_KEY}
      SEO_CONTENT_MOLTBOOK_AUTOPUBLISH: ${SEO_CONTENT_MOLTBOOK_AUTOPUBLISH:-false}
      SEO_CONTENT_MULTI_CHANNEL_AUTOPUBLISH: ${SEO_CONTENT_MULTI_CHANNEL_AUTOPUBLISH:-false}
      SOCIAL_PUBLISHING_AGENT_X_API_KEY: ${SOCIAL_PUBLISHING_AGENT_X_API_KEY}
      SOCIAL_PUBLISHING_AGENT_X_API_SECRET: ${SOCIAL_PUBLISHING_AGENT_X_API_SECRET}
      SOCIAL_PUBLISHING_AGENT_X_ACCESS_TOKEN: ${SOCIAL_PUBLISHING_AGENT_X_ACCESS_TOKEN}
      SOCIAL_PUBLISHING_AGENT_X_ACCESS_TOKEN_SECRET: ${SOCIAL_PUBLISHING_AGENT_X_ACCESS_TOKEN_SECRET}
      SOCIAL_PUBLISHING_AGENT_X_AUTOPUBLISH: ${SOCIAL_PUBLISHING_AGENT_X_AUTOPUBLISH:-false}
      SOCIAL_PUBLISHING_AGENT_TELEGRAM_BOT_TOKEN: ${SOCIAL_PUBLISHING_AGENT_TELEGRAM_BOT_TOKEN}
      SOCIAL_PUBLISHING_AGENT_TELEGRAM_CHAT_ID: ${SOCIAL_PUBLISHING_AGENT_TELEGRAM_CHAT_ID}
      SOCIAL_PUBLISHING_AGENT_TELEGRAM_AUTOPUBLISH: ${SOCIAL_PUBLISHING_AGENT_TELEGRAM_AUTOPUBLISH:-false}
      SOCIAL_PUBLISHING_AGENT_TELEGRAM_DEFAULT_CHANNEL: ${SOCIAL_PUBLISHING_AGENT_TELEGRAM_DEFAULT_CHANNEL}
      SOCIAL_PUBLISHING_AGENT_MOLTBOOK_AGENT_API_KEY: ${SOCIAL_PUBLISHING_AGENT_MOLTBOOK_AGENT_API_KEY}
      SOCIAL_PUBLISHING_AGENT_MOLTBOOK_APP_KEY: ${SOCIAL_PUBLISHING_AGENT_MOLTBOOK_APP_KEY}
      SOCIAL_PUBLISHING_AGENT_MOLTBOOK_AUTOPUBLISH: ${SOCIAL_PUBLISHING_AGENT_MOLTBOOK_AUTOPUBLISH:-false}
      COMMUNITY_ENGAGEMENT_AGENT_X_API_KEY: ${COMMUNITY_ENGAGEMENT_AGENT_X_API_KEY}
      COMMUNITY_ENGAGEMENT_AGENT_X_API_SECRET: ${COMMUNITY_ENGAGEMENT_AGENT_X_API_SECRET}
      COMMUNITY_ENGAGEMENT_AGENT_X_ACCESS_TOKEN: ${COMMUNITY_ENGAGEMENT_AGENT_X_ACCESS_TOKEN}
      COMMUNITY_ENGAGEMENT_AGENT_X_ACCESS_TOKEN_SECRET: ${COMMUNITY_ENGAGEMENT_AGENT_X_ACCESS_TOKEN_SECRET}
      COMMUNITY_ENGAGEMENT_AGENT_X_AUTOPUBLISH: ${COMMUNITY_ENGAGEMENT_AGENT_X_AUTOPUBLISH:-false}
      COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_BOT_TOKEN: ${COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_BOT_TOKEN}
      COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_CHAT_ID: ${COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_CHAT_ID}
      COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_AUTOPUBLISH: ${COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_AUTOPUBLISH:-false}
      COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_DEFAULT_CHANNEL: ${COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_DEFAULT_CHANNEL}
      COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_AGENT_API_KEY: ${COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_AGENT_API_KEY}
      COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_APP_KEY: ${COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_APP_KEY}
      COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_AUTOPUBLISH: ${COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_AUTOPUBLISH:-false}
      SEO_MULTI_CHANNEL_AUTOPUBLISH: ${SEO_MULTI_CHANNEL_AUTOPUBLISH:-false}
      SEO_PAGES_OUTPUT_DIR: ${SEO_PAGES_OUTPUT_DIR:-/var/www/html/seo}
      SEO_PAGES_BASE_URL: ${SEO_PAGES_BASE_URL:-https://aifinpay.io/blog}
      SEO_INDEXNOW_KEY: ${SEO_INDEXNOW_KEY}
    volumes:
      - seo_pages:${SEO_PAGES_OUTPUT_DIR:-/var/www/html/seo}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aifp-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-worker:latest
    container_name: aifp_worker_prod
    restart: unless-stopped
    command: ["uv", "run", "dramatiq", "apps.workers.tasks:broker", "--processes", "2", "--threads", "4"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aifp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aifp_prod}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      MOLTBOOK_BASE_URL: ${MOLTBOOK_BASE_URL}
      MOLTBOOK_API_KEY: ${MOLTBOOK_API_KEY}
      MOLTBOOK_AGENT_API_KEY: ${MOLTBOOK_AGENT_API_KEY}
      MOLTBOOK_APP_KEY: ${MOLTBOOK_APP_KEY}
      MOLTBOOK_AUTOPUBLISH: ${MOLTBOOK_AUTOPUBLISH:-false}
      X_API_KEY: ${X_API_KEY}
      X_API_SECRET: ${X_API_SECRET}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN}
      X_ACCESS_TOKEN_SECRET: ${X_ACCESS_TOKEN_SECRET}
      X_AUTOPUBLISH: ${X_AUTOPUBLISH:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_DEFAULT_CHANNEL: ${TELEGRAM_DEFAULT_CHANNEL}
      TELEGRAM_AUTOPUBLISH: ${TELEGRAM_AUTOPUBLISH:-false}
      NEWS_API_KEY: ${NEWS_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      FOUNDER_CONTENT_X_API_KEY: ${FOUNDER_CONTENT_X_API_KEY}
      FOUNDER_CONTENT_X_API_SECRET: ${FOUNDER_CONTENT_X_API_SECRET}
      FOUNDER_CONTENT_X_ACCESS_TOKEN: ${FOUNDER_CONTENT_X_ACCESS_TOKEN}
      FOUNDER_CONTENT_X_ACCESS_TOKEN_SECRET: ${FOUNDER_CONTENT_X_ACCESS_TOKEN_SECRET}
      FOUNDER_CONTENT_X_AUTOPUBLISH: ${FOUNDER_CONTENT_X_AUTOPUBLISH:-false}
      FOUNDER_CONTENT_TELEGRAM_BOT_TOKEN: ${FOUNDER_CONTENT_TELEGRAM_BOT_TOKEN}
      FOUNDER_CONTENT_TELEGRAM_CHAT_ID: ${FOUNDER_CONTENT_TELEGRAM_CHAT_ID}
      FOUNDER_CONTENT_TELEGRAM_AUTOPUBLISH: ${FOUNDER_CONTENT_TELEGRAM_AUTOPUBLISH:-false}
      FOUNDER_CONTENT_TELEGRAM_DEFAULT_CHANNEL: ${FOUNDER_CONTENT_TELEGRAM_DEFAULT_CHANNEL}
      FOUNDER_CONTENT_MOLTBOOK_AGENT_API_KEY: ${FOUNDER_CONTENT_MOLTBOOK_AGENT_API_KEY}
      FOUNDER_CONTENT_MOLTBOOK_APP_KEY: ${FOUNDER_CONTENT_MOLTBOOK_APP_KEY}
      FOUNDER_CONTENT_MOLTBOOK_AUTOPUBLISH: ${FOUNDER_CONTENT_MOLTBOOK_AUTOPUBLISH:-false}
      TECHNICAL_CONTENT_X_API_KEY: ${TECHNICAL_CONTENT_X_API_KEY}
      TECHNICAL_CONTENT_X_API_SECRET: ${TECHNICAL_CONTENT_X_API_SECRET}
      TECHNICAL_CONTENT_X_ACCESS_TOKEN: ${TECHNICAL_CONTENT_X_ACCESS_TOKEN}
      TECHNICAL_CONTENT_X_ACCESS_TOKEN_SECRET: ${TECHNICAL_CONTENT_X_ACCESS_TOKEN_SECRET}
      TECHNICAL_CONTENT_X_AUTOPUBLISH: ${TECHNICAL_CONTENT_X_AUTOPUBLISH:-false}
      TECHNICAL_CONTENT_TELEGRAM_BOT_TOKEN: ${TECHNICAL_CONTENT_TELEGRAM_BOT_TOKEN}
      TECHNICAL_CONTENT_TELEGRAM_CHAT_ID: ${TECHNICAL_CONTENT_TELEGRAM_CHAT_ID}
      TECHNICAL_CONTENT_TELEGRAM_AUTOPUBLISH: ${TECHNICAL_CONTENT_TELEGRAM_AUTOPUBLISH:-false}
      TECHNICAL_CONTENT_TELEGRAM_DEFAULT_CHANNEL: ${TECHNICAL_CONTENT_TELEGRAM_DEFAULT_CHANNEL}
      TECHNICAL_CONTENT_MOLTBOOK_AGENT_API_KEY: ${TECHNICAL_CONTENT_MOLTBOOK_AGENT_API_KEY}
      TECHNICAL_CONTENT_MOLTBOOK_APP_KEY: ${TECHNICAL_CONTENT_MOLTBOOK_APP_KEY}
      TECHNICAL_CONTENT_MOLTBOOK_AUTOPUBLISH: ${TECHNICAL_CONTENT_MOLTBOOK_AUTOPUBLISH:-false}
      SEO_CONTENT_X_API_KEY: ${SEO_CONTENT_X_API_KEY}
      SEO_CONTENT_X_API_SECRET: ${SEO_CONTENT_X_API_SECRET}
      SEO_CONTENT_X_ACCESS_TOKEN: ${SEO_CONTENT_X_ACCESS_TOKEN}
      SEO_CONTENT_X_ACCESS_TOKEN_SECRET: ${SEO_CONTENT_X_ACCESS_TOKEN_SECRET}
      SEO_CONTENT_X_AUTOPUBLISH: ${SEO_CONTENT_X_AUTOPUBLISH:-false}
      SEO_CONTENT_TELEGRAM_BOT_TOKEN: ${SEO_CONTENT_TELEGRAM_BOT_TOKEN}
      SEO_CONTENT_TELEGRAM_CHAT_ID: ${SEO_CONTENT_TELEGRAM_CHAT_ID}
      SEO_CONTENT_TELEGRAM_AUTOPUBLISH: ${SEO_CONTENT_TELEGRAM_AUTOPUBLISH:-false}
      SEO_CONTENT_TELEGRAM_DEFAULT_CHANNEL: ${SEO_CONTENT_TELEGRAM_DEFAULT_CHANNEL}
      SEO_CONTENT_MOLTBOOK_AGENT_API_KEY: ${SEO_CONTENT_MOLTBOOK_AGENT_API_KEY}
      SEO_CONTENT_MOLTBOOK_APP_KEY: ${SEO_CONTENT_MOLTBOOK_APP_KEY}
      SEO_CONTENT_MOLTBOOK_AUTOPUBLISH: ${SEO_CONTENT_MOLTBOOK_AUTOPUBLISH:-false}
      SEO_CONTENT_MULTI_CHANNEL_AUTOPUBLISH: ${SEO_CONTENT_MULTI_CHANNEL_AUTOPUBLISH:-false}
      SOCIAL_PUBLISHING_AGENT_X_API_KEY: ${SOCIAL_PUBLISHING_AGENT_X_API_KEY}
      SOCIAL_PUBLISHING_AGENT_X_API_SECRET: ${SOCIAL_PUBLISHING_AGENT_X_API_SECRET}
      SOCIAL_PUBLISHING_AGENT_X_ACCESS_TOKEN: ${SOCIAL_PUBLISHING_AGENT_X_ACCESS_TOKEN}
      SOCIAL_PUBLISHING_AGENT_X_ACCESS_TOKEN_SECRET: ${SOCIAL_PUBLISHING_AGENT_X_ACCESS_TOKEN_SECRET}
      SOCIAL_PUBLISHING_AGENT_X_AUTOPUBLISH: ${SOCIAL_PUBLISHING_AGENT_X_AUTOPUBLISH:-false}
      SOCIAL_PUBLISHING_AGENT_TELEGRAM_BOT_TOKEN: ${SOCIAL_PUBLISHING_AGENT_TELEGRAM_BOT_TOKEN}
      SOCIAL_PUBLISHING_AGENT_TELEGRAM_CHAT_ID: ${SOCIAL_PUBLISHING_AGENT_TELEGRAM_CHAT_ID}
      SOCIAL_PUBLISHING_AGENT_TELEGRAM_AUTOPUBLISH: ${SOCIAL_PUBLISHING_AGENT_TELEGRAM_AUTOPUBLISH:-false}
      SOCIAL_PUBLISHING_AGENT_TELEGRAM_DEFAULT_CHANNEL: ${SOCIAL_PUBLISHING_AGENT_TELEGRAM_DEFAULT_CHANNEL}
      SOCIAL_PUBLISHING_AGENT_MOLTBOOK_AGENT_API_KEY: ${SOCIAL_PUBLISHING_AGENT_MOLTBOOK_AGENT_API_KEY}
      SOCIAL_PUBLISHING_AGENT_MOLTBOOK_APP_KEY: ${SOCIAL_PUBLISHING_AGENT_MOLTBOOK_APP_KEY}
      SOCIAL_PUBLISHING_AGENT_MOLTBOOK_AUTOPUBLISH: ${SOCIAL_PUBLISHING_AGENT_MOLTBOOK_AUTOPUBLISH:-false}
      COMMUNITY_ENGAGEMENT_AGENT_X_API_KEY: ${COMMUNITY_ENGAGEMENT_AGENT_X_API_KEY}
      COMMUNITY_ENGAGEMENT_AGENT_X_API_SECRET: ${COMMUNITY_ENGAGEMENT_AGENT_X_API_SECRET}
      COMMUNITY_ENGAGEMENT_AGENT_X_ACCESS_TOKEN: ${COMMUNITY_ENGAGEMENT_AGENT_X_ACCESS_TOKEN}
      COMMUNITY_ENGAGEMENT_AGENT_X_ACCESS_TOKEN_SECRET: ${COMMUNITY_ENGAGEMENT_AGENT_X_ACCESS_TOKEN_SECRET}
      COMMUNITY_ENGAGEMENT_AGENT_X_AUTOPUBLISH: ${COMMUNITY_ENGAGEMENT_AGENT_X_AUTOPUBLISH:-false}
      COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_BOT_TOKEN: ${COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_BOT_TOKEN}
      COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_CHAT_ID: ${COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_CHAT_ID}
      COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_AUTOPUBLISH: ${COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_AUTOPUBLISH:-false}
      COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_DEFAULT_CHANNEL: ${COMMUNITY_ENGAGEMENT_AGENT_TELEGRAM_DEFAULT_CHANNEL}
      COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_AGENT_API_KEY: ${COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_AGENT_API_KEY}
      COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_APP_KEY: ${COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_APP_KEY}
      COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_AUTOPUBLISH: ${COMMUNITY_ENGAGEMENT_AGENT_MOLTBOOK_AUTOPUBLISH:-false}
      SEO_MULTI_CHANNEL_AUTOPUBLISH: ${SEO_MULTI_CHANNEL_AUTOPUBLISH:-false}
      SEO_PAGES_OUTPUT_DIR: ${SEO_PAGES_OUTPUT_DIR:-/var/www/html/seo}
      SEO_PAGES_BASE_URL: ${SEO_PAGES_BASE_URL:-https://aifinpay.io/blog}
      SEO_INDEXNOW_KEY: ${SEO_INDEXNOW_KEY}
    volumes:
      - seo_pages:${SEO_PAGES_OUTPUT_DIR:-/var/www/html/seo}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aifp-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-api:latest
    container_name: aifp_scheduler_prod
    restart: unless-stopped
    command: ["uv", "run", "periodiq", "apps.workers.periodic_scheduler"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aifp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aifp_prod}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    volumes:
      - seo_pages:${SEO_PAGES_OUTPUT_DIR:-/var/www/html/seo}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aifp-network

  certbot:
    image: certbot/certbot:latest
    container_name: aifp_certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - aifp-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: aifp_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - aifp-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aifp_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - aifp-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: aifp_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - aifp-network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: aifp_postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-aifp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aifp_prod}?sslmode=disable
    depends_on:
      - postgres
    networks:
      - aifp-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: aifp_redis_exporter
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    networks:
      - aifp-network
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-api:latest
    container_name: aifp_backup
    command: >
      sh -c "
      chmod +x /app/scripts/backup_database.sh /app/scripts/test_restore.sh /app/scripts/monitor_backups.sh
      while true; do
        echo 'Running scheduled backup...'
        /app/scripts/backup_database.sh
        echo 'Running backup monitoring...'
        /app/scripts/monitor_backups.sh
        echo 'Backup cycle completed. Next run in 24 hours.'
        sleep 86400
      done
      "
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aifp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aifp_prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./backups:/backups
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aifp-network
    restart: unless-stopped

  dashboard:
    build:
      context: apps/dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: aifp-aos-dashboard:latest
    networks:
      - aifp-network
    restart: unless-stopped

  cert-init:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-api:latest
    working_dir: /app
    command: ["uv", "run", "python", "scripts/generate_ssl_cert.py", "--cert-dir", "/certs"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./nginx/ssl:/certs
    networks:
      - aifp-network
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
      - seo_pages:/var/www/html/seo:ro
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      api:
        condition: service_started
      cert-init:
        condition: service_completed_successfully
    networks:
      - aifp-network
    restart: unless-stopped

networks:
  aifp-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  seo_pages:
  prometheus_data:
  grafana_data:
  alertmanager_data:
