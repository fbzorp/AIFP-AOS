services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aifp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aifp_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aifp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aifp} -d ${POSTGRES_DB:-aifp_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - aifp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-api:latest
    expose:
      - "8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aifp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aifp_prod}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aifp-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-worker:latest
    container_name: aifp_worker_prod
    restart: unless-stopped
    command: ["uv", "run", "dramatiq", "apps.workers.tasks:broker", "--processes", "2", "--threads", "4"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aifp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aifp_prod}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      EVM_RPC_URL: ${EVM_RPC_URL}
      AIFINPAY_AGENT_SECRET: ${AIFINPAY_AGENT_SECRET}
      AIFINPAY_AGENT_PUBKEY: ${AIFINPAY_AGENT_PUBKEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aifp-network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-scheduler:latest
    container_name: aifp_scheduler_prod
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "periodiq", "apps.workers.tasks:broker", "apps.workers.periodic_scheduler:SCHEDULES"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aifp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aifp_prod}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aifp-network
    restart: unless-stopped

  dashboard:
    build:
      context: apps/dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: aifp-aos-dashboard:latest
    networks:
      - aifp-network
    restart: unless-stopped

  cert-init:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-api:latest
    working_dir: /app
    command: ["uv", "run", "python", "scripts/generate_ssl_cert.py", "--cert-dir", "/certs"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./nginx/ssl:/certs
    networks:
      - aifp-network
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      api:
        condition: service_started
      cert-init:
        condition: service_completed_successfully
    networks:
      - aifp-network
    restart: unless-stopped

networks:
  aifp-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
