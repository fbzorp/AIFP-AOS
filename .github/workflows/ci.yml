name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aifp
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: aifp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      run: pip install uv
    
    - name: Install dependencies
      run: |
        uv sync --frozen --all-groups
      env:
        DATABASE_URL: postgresql+asyncpg://aifp:devpassword@localhost:5432/aifp_dev
        REDIS_URL: redis://localhost:6379/0
    
    - name: Check OpenAPI spec freshness
      run: |
        uv run python scripts/export_openapi.py --check
    
    - name: Run database migrations
      run: |
        uv run alembic upgrade head
      env:
        DATABASE_URL: postgresql+asyncpg://aifp:devpassword@localhost:5432/aifp_dev
    
    - name: Run tests with coverage
      run: |
        uv run pytest tests/ -v --cov=apps --cov-report=xml --cov-report=term --cov-fail-under=74
      env:
        DATABASE_URL: postgresql+asyncpg://aifp:devpassword@localhost:5432/aifp_dev
        REDIS_URL: redis://localhost:6379/0
        PAYMENTS_KILL_SWITCH: false
        SOLANA_RPC_URL: https://api.devnet.solana.com
        PAYMENTS_NETWORK: devnet
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      run: pip install uv
    
    - name: Install dependencies
      run: uv sync --frozen --all-groups
    
    - name: Run pip-audit
      run: uv run pip-audit --ignore-vuln PYSEC-2026-1325
    
    - name: Run bandit security analysis
      run: uv run bandit -r apps/ -f json -o bandit-report.json || true
    
    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
    
    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true