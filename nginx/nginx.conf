events {
    worker_connections 1024;
}

http {
    # Resolver for dynamic DNS resolution
    resolver 127.0.0.11 valid=30s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=20r/s;

    # Upstream servers
    upstream api {
        server api:8000;
    }

    upstream dashboard {
        server dashboard:80;
    }

    # Include the templated configuration
    include /etc/nginx/conf.d/*.conf;
}
