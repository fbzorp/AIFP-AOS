services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aifp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password}
      POSTGRES_DB: ${POSTGRES_DB:-aifp_staging}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aifp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aifp} -d ${POSTGRES_DB:-aifp_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - aifp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-api:latest
    expose:
      - "8000"
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aifp}:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/${POSTGRES_DB:-aifp_staging}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      MOLTBOOK_BASE_URL: ${MOLTBOOK_BASE_URL}
      MOLTBOOK_API_KEY: ${MOLTBOOK_API_KEY}
      MOLTBOOK_AGENT_API_KEY: ${MOLTBOOK_AGENT_API_KEY}
      MOLTBOOK_APP_KEY: ${MOLTBOOK_APP_KEY}
