  cert-init:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aifp-aos-api:latest
    working_dir: /app
    command: ["uv", "run", "python", "scripts/generate_ssl_cert.py", "--cert-dir", "/certs"]
    environment:
      - DOMAIN=${DOMAIN:-staging.aifp-aos.local}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./nginx/ssl:/certs
    networks:
      - aifp-network
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    environment:
      - DOMAIN=${DOMAIN:-staging.aifp-aos.local}
    depends_on:
      api:
        condition: service_started
      cert-init:
        condition: service_completed_successfully
    networks:
